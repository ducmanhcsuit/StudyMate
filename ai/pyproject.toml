[project]
name = "studymate-ai"
version = "0.1.0"
description = "Service AI nội bộ của StudyMate: ingest, hybrid search, chat, sinh quiz"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.162.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
